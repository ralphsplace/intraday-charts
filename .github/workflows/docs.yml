name: Docs

# Builds the user guide (docs/, mkdocs.yml) on every push and pull request, checking every link (--strict),
# and publishes it to GitHub Pages from main. Pages must be set to "Source: GitHub Actions" in the repository's
# settings.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Known vulnerabilities in the pinned docs packages
        run: pipx run pip-audit -r requirements-docs.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
