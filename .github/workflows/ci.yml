name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # same as the Dockerfile
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check app tools tests
      - name: Known vulnerabilities in the pinned dependencies
        run: pip-audit -r requirements.txt
      - name: Tests (with browser tests and coverage)
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check the container's protections
        run: sh tests/docker_smoke.sh
